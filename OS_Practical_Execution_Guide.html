<script>
const D=[{"n": 1, "g": "A", "t": "System Calls", "f": "set1_system_calls.c", "lang": "C", "desc": "Unix system calls: fork/getpid/getppid/wait/exec, open/write/read/close, read/write I/O", "cmds": ["gcc set1_system_calls.c -o set1", "./set1"], "inp": "Type any string when it asks “Enter a string:”. Sample input used: Hello Operating System", "notes": ["Parent and child print their PID and PPID; the child PID is the parent's “Child PID”.", "exec() replaces the child with ls -l, so nothing after exec runs in the child.", "wait() makes the parent print its last line only after the child finishes."], "var": true, "out": "=== (i) Process Management ===\nParent : PID = 155, PPID = 118, Child PID = 156\nParent : waiting for child using wait()...\nChild  : PID = 156, PPID = 155\nChild  : replacing my image with 'ls -l' using exec()\ntotal 8\n-rw-r--r-- 1 root root 2 Nov 16 19:27 a.out\n-rw-r--r-- 1 root root 2 Nov 16 19:27 notes.txt\nParent : child finished (exit status = 0)\n\n=== (ii) File Management ===\nFile 'sample.txt' created (fd = 3)\nBytes written : 94\nBytes read    : 94\nFile contents :\nLine 1: Operating System Practical\nLine 2: Unix system calls\nLine 3: open, write, read, close\nFile closed.\n\n=== (iii) Input/Output using read() and write() ===\nEnter a string: You entered   : Hello Operating System"}, {"n": 2, "g": "A", "t": "FCFS and SJF Scheduling", "f": "set2_fcfs_sjf.py", "lang": "Python", "desc": "FCFS and non-preemptive SJF with Gantt chart, CT, TAT, WT and averages", "cmds": ["python3 set2_fcfs_sjf.py"], "inp": null, "notes": ["Compare the average waiting time and turnaround time of both algorithms.", "The algorithm with the lower averages is the optimal schedule (SJF)."], "var": false, "out": "\n============================================================\nFCFS Scheduling\n============================================================\nGantt Chart:\n| P1 | P2 | P3 | P4 | P5 |\n0    6   14   21   24   28\n\nTimeline: P1(0-6)  P2(6-14)  P3(14-21)  P4(21-24)  P5(24-28)\n\nProcess  AT   BT   CT   TAT   WT   \n-----------------------------------\nP1       0    6    6    6     0    \nP2       1    8    14   13    5    \nP3       2    7    21   19    12   \nP4       3    3    24   21    18   \nP5       4    4    28   24    20   \n-----------------------------------\nAverage Turnaround Time = 16.60\nAverage Waiting Time    = 11.00\n\n============================================================\nSJF (Non-Preemptive) Scheduling\n============================================================\nGantt Chart:\n| P1 | P4 | P5 | P3 | P2 |\n0    6    9   13   20   28\n\nTimeline: P1(0-6)  P4(6-9)  P5(9-13)  P3(13-20)  P2(20-28)\n\nProcess  AT   BT   CT   TAT   WT   \n-----------------------------------\nP1       0    6    6    6     0    \nP2       1    8    28   27    19   \nP3       2    7    20   18    11   \nP4       3    3    9    6     3    \nP5       4    4    13   9     5    \n-----------------------------------\nAverage Turnaround Time = 13.20\nAverage Waiting Time    = 7.60\n\n============================================================\nCOMPARISON / OPTIMAL SCHEDULE\n============================================================\nAlgorithm   Avg WT    Avg TAT   \nFCFS        11.00     16.60     \nSJF         7.60      13.20     \n\nOptimal schedule: SJF (Non-Preemptive) (lowest average waiting time)."}, {"n": 3, "g": "A", "t": "Round Robin and Priority Scheduling", "f": "set3_rr_priority.py", "lang": "Python", "desc": "Round Robin (TQ = 3) and non-preemptive Priority scheduling, all arrivals at 0", "cmds": ["python3 set3_rr_priority.py"], "inp": null, "notes": ["Lower priority number = higher priority.", "Compare average waiting and turnaround times to pick the better schedule."], "var": false, "out": "\n==============================================================\nRound Robin (Time Quantum = 3)\n==============================================================\nGantt Chart:\n| P1 | P2 | P3 | P4 | P5 | P1 | P5 | P1 | P1 |\n0    3    4    6    7   10   13   15   18   19\n\nProcess  AT   BT   Pri  CT   TAT   WT   \n----------------------------------------\nP1       0    10   3    19   19    9    \nP2       0    1    1    4    4     3    \nP3       0    2    4    6    6     4    \nP4       0    1    5    7    7     6    \nP5       0    5    2    15   15    10   \n----------------------------------------\nAverage Turnaround Time = 10.20\nAverage Waiting Time    = 6.40\n\n==============================================================\nPriority Scheduling (Non-Preemptive)\n==============================================================\nGantt Chart:\n| P2 | P5 | P1 | P3 | P4 |\n0    1    6   16   18   19\n\nProcess  AT   BT   Pri  CT   TAT   WT   \n----------------------------------------\nP1       0    10   3    16   16    6    \nP2       0    1    1    1    1     0    \nP3       0    2    4    18   18    16   \nP4       0    1    5    19   19    18   \nP5       0    5    2    6    6     1    \n----------------------------------------\nAverage Turnaround Time = 12.00\nAverage Waiting Time    = 8.20\n\n==============================================================\nCOMPARISON / OPTIMAL SCHEDULE\n==============================================================\nAlgorithm             Avg WT    Avg TAT   \nRound Robin (q=3)     6.40      10.20     \nPriority (non-pre.)   8.20      12.00     \n\nOptimal schedule: Round Robin (lowest average waiting and turnaround time)."}, {"n": 4, "g": "B", "t": "Producer–Consumer (Semaphores)", "f": "set4_producer_consumer.c", "lang": "C", "desc": "Bounded buffer of size 5, 2 producers, 2 consumers, 5 items each, using empty/full/mutex", "cmds": ["gcc set4_producer_consumer.c -o set4 -pthread", "./set4"], "inp": null, "notes": ["Interleaving of producer and consumer lines differs on every run – this is normal.", "Items in buffer never goes below 0 or above 5 (no underflow or overflow).", "Always ends with “Items left in buffer = 0”."], "var": true, "out": "Producer-Consumer: buffer size = 5, 2 producers, 2 consumers, 5 items each\n\nProducer 1 produced item 101 -> buffer[0]  (items in buffer = 1)\n    Consumer 1 consumed item 101 <- buffer[0]  (items in buffer = 0)\nProducer 1 produced item 102 -> buffer[1]  (items in buffer = 1)\n    Consumer 2 consumed item 102 <- buffer[1]  (items in buffer = 0)\nProducer 2 produced item 201 -> buffer[2]  (items in buffer = 1)\nProducer 1 produced item 103 -> buffer[3]  (items in buffer = 2)\nProducer 2 produced item 202 -> buffer[4]  (items in buffer = 3)\n    Consumer 1 consumed item 201 <- buffer[2]  (items in buffer = 2)\nProducer 1 produced item 104 -> buffer[0]  (items in buffer = 3)\nProducer 1 produced item 105 -> buffer[1]  (items in buffer = 4)\nProducer 2 produced item 203 -> buffer[2]  (items in buffer = 5)\n    Consumer 2 consumed item 103 <- buffer[3]  (items in buffer = 4)\nProducer 2 produced item 204 -> buffer[3]  (items in buffer = 5)\n    Consumer 1 consumed item 202 <- buffer[4]  (items in buffer = 4)\n    Consumer 2 consumed item 104 <- buffer[0]  (items in buffer = 3)\n    Consumer 1 consumed item 105 <- buffer[1]  (items in buffer = 2)\nProducer 2 produced item 205 -> buffer[4]  (items in buffer = 3)\n    Consumer 2 consumed item 203 <- buffer[2]  (items in buffer = 2)\n    Consumer 1 consumed item 204 <- buffer[3]  (items in buffer = 1)\n    Consumer 2 consumed item 205 <- buffer[4]  (items in buffer = 0)\n\nAll threads finished. Items left in buffer = 0"}, {"n": 5, "g": "B", "t": "Reader–Writer (Java Locks)", "f": "ReaderWriterDemo.java", "lang": "Java", "desc": "ReentrantReadWriteLock with 3 readers and 2 writers", "cmds": ["javac ReaderWriterDemo.java", "java ReaderWriterDemo"], "inp": null, "notes": ["Several readers can hold the read lock together (active readers > 1).", "A writer gets exclusive access – no reader reads while a write lock is held.", "Timestamps differ per run, but the final counter is always 40 (2 writers × 2 updates × 10)."], "var": true, "out": "[   22 ms] Writer 1 waiting for WRITE lock\n[   41 ms] Writer 1 ACQUIRED write lock (exclusive access)\n[   47 ms] Writer 2 waiting for WRITE lock\n[  115 ms] Reader 1 waiting for READ lock\n[  195 ms] Reader 2 waiting for READ lock\n[  237 ms] Reader 3 waiting for READ lock\n[  352 ms] Writer 1 updated counter 0 -> 10\n[  352 ms] Writer 1 RELEASING write lock\n[  353 ms] Writer 2 ACQUIRED write lock (exclusive access)\n[  384 ms] Writer 1 waiting for WRITE lock\n[  653 ms] Writer 2 updated counter 10 -> 20\n[  653 ms] Writer 2 RELEASING write lock\n[  656 ms] Reader 1 ACQUIRED read lock  (active readers = 1)\n[  656 ms] Reader 1 reads counter = 20\n[  656 ms] Reader 3 ACQUIRED read lock  (active readers = 3)\n[  656 ms] Reader 3 reads counter = 20\n[  657 ms] Reader 2 ACQUIRED read lock  (active readers = 2)\n[  658 ms] Reader 2 reads counter = 20\n[  695 ms] Writer 2 waiting for WRITE lock\n[ 1057 ms] Reader 3 RELEASING read lock\n[ 1058 ms] Reader 1 RELEASING read lock\n[ 1058 ms] Reader 2 RELEASING read lock\n[ 1059 ms] Writer 1 ACQUIRED write lock (exclusive access)\n[ 1142 ms] Reader 1 waiting for READ lock\n[ 1148 ms] Reader 3 waiting for READ lock\n[ 1314 ms] Reader 2 waiting for READ lock\n[ 1360 ms] Writer 1 updated counter 20 -> 30\n[ 1360 ms] Writer 1 RELEASING write lock\n[ 1361 ms] Writer 2 ACQUIRED write lock (exclusive access)\n[ 1662 ms] Writer 2 updated counter 30 -> 40\n[ 1662 ms] Writer 2 RELEASING write lock\n[ 1662 ms] Reader 1 ACQUIRED read lock  (active readers = 1)\n[ 1663 ms] Reader 1 reads counter = 40\n[ 1662 ms] Reader 3 ACQUIRED read lock  (active readers = 2)\n[ 1663 ms] Reader 3 reads counter = 40\n[ 1662 ms] Reader 2 ACQUIRED read lock  (active readers = 3)\n[ 1664 ms] Reader 2 reads counter = 40\n[ 2063 ms] Reader 1 RELEASING read lock\n[ 2064 ms] Reader 3 RELEASING read lock\n[ 2064 ms] Reader 2 RELEASING read lock\n\nFinal value of shared counter = 40  (expected 2 writers x 2 updates x 10 = 40)"}, {"n": 6, "g": "B", "t": "Memory Allocation (First / Best / Worst Fit)", "f": "set6_memory_allocation.py", "lang": "Python", "desc": "Fixed partitions 100, 500, 200, 300, 600 KB; processes 212, 417, 112, 426 KB", "cmds": ["python3 set6_memory_allocation.py"], "inp": null, "notes": ["Check which process stays unallocated in each strategy.", "The strategy that allocates all processes with the least fragmentation uses memory best."], "var": false, "out": "Memory partitions (KB): [100, 500, 200, 300, 600]\nProcesses (KB)        : P1=212, P2=417, P3=112, P4=426\n\n================================================================\nFirst Fit\n================================================================\nProcess  Size(KB)  Partition             Internal Frag(KB) \n-----------------------------------------------------------\nP1       212       Partition 2 (500 KB)  288               \nP2       417       Partition 5 (600 KB)  183               \nP3       112       Partition 3 (200 KB)  88                \nP4       426       NOT ALLOCATED         -                 \n-----------------------------------------------------------\nTotal internal fragmentation : 559 KB\nUnallocated processes        : P4\nMemory utilization           : 741/1700 KB = 43.59%\n\n================================================================\nBest Fit\n================================================================\nProcess  Size(KB)  Partition             Internal Frag(KB) \n-----------------------------------------------------------\nP1       212       Partition 4 (300 KB)  88                \nP2       417       Partition 2 (500 KB)  83                \nP3       112       Partition 3 (200 KB)  88                \nP4       426       Partition 5 (600 KB)  174               \n-----------------------------------------------------------\nTotal internal fragmentation : 433 KB\nUnallocated processes        : None\nMemory utilization           : 1167/1700 KB = 68.65%\n\n================================================================\nWorst Fit\n================================================================\nProcess  Size(KB)  Partition             Internal Frag(KB) \n-----------------------------------------------------------\nP1       212       Partition 5 (600 KB)  388               \nP2       417       Partition 2 (500 KB)  83                \nP3       112       Partition 4 (300 KB)  188               \nP4       426       NOT ALLOCATED         -                 \n-----------------------------------------------------------\nTotal internal fragmentation : 659 KB\nUnallocated processes        : P4\nMemory utilization           : 741/1700 KB = 43.59%\n\n================================================================\nCOMPARISON\n================================================================\nStrategy    Unallocated   Int. Frag (KB)   Utilization \nFirst Fit   1             559              43.59%\nBest Fit    0             433              68.65%\nWorst Fit   1             659              43.59%\n\nBest strategy for the given data: Best Fit (fewest unallocated processes, highest memory utilization)."}, {"n": 7, "g": "C", "t": "Banker's Algorithm – Avoidance", "f": "set7_bankers_safety_request.py", "lang": "Python", "desc": "Need matrix, safe state, safe sequence and request P1 = (1,0,2)", "cmds": ["python3 set7_bankers_safety_request.py"], "inp": null, "notes": ["Need = Maximum − Allocation.", "Safe sequence shows the order in which all processes can finish.", "The request is granted only if it is ≤ Need, ≤ Available and the new state is safe."], "var": false, "out": "Allocation / Maximum / Need matrices\nProcess  AlA AlB AlC    MxA MxB MxC    NdA NdB NdC \n---------------------------------------------\nP0       0   1   0      7   5   3      7   4   3   \nP1       2   0   0      3   2   2      1   2   2   \nP2       3   0   2      9   0   2      6   0   0   \nP3       2   1   1      2   2   2      0   1   1   \nP4       0   0   2      4   3   3      4   3   1   \n\nAvailable = (3, 3, 2)\n\n--- Safety check of the initial state ---\nSystem is in a SAFE state.\nSafe sequence: <P1, P3, P4, P0, P2>\n\n--- Resource request: P1 requests (1,0,2) ---\nRequest GRANTED immediately.\nReason: System stays SAFE. Safe sequence: P1 -> P3 -> P4 -> P0 -> P2"}, {"n": 8, "g": "C", "t": "Banker's Algorithm – Prevention", "f": "set8_bankers_prevention.py", "lang": "Python", "desc": "Initial safety check, then requests (a) P1 (1,0,2), (b) P0 (0,2,0), (c) P2 (4,0,1)", "cmds": ["python3 set8_bankers_prevention.py"], "inp": null, "notes": ["Each request is tested independently on the initial state.", "A request is denied if it exceeds Need, exceeds Available, or leads to an unsafe state."], "var": false, "out": "Process  AlA AlB AlC    MxA MxB MxC    NdA NdB NdC \n---------------------------------------------\nP0       0   1   0      7   5   3      7   4   3   \nP1       2   0   0      3   2   2      1   2   2   \nP2       3   0   3      9   0   6      6   0   3   \nP3       2   1   1      2   2   2      0   1   1   \n\nAvailable = (3, 3, 2)\n\n--- Initial state safety check ---\nInitial state is SAFE\nSafe sequence: <P1, P3, P0, P2>\n\n--- Resource requests (each processed independently) ---\n(a) P1 requests (1, 0, 2)  ->  GRANTED: state after allocation is SAFE, safe sequence = P1 -> P3 -> P0 -> P2\n(b) P0 requests (0, 2, 0)  ->  GRANTED: state after allocation is SAFE, safe sequence = P3 -> P1 -> P2 -> P0\n(c) P2 requests (4, 0, 1)  ->  DENIED: Request (4, 0, 1) > Available (3, 3, 2) (process must wait)"}, {"n": 9, "g": "C", "t": "FIFO and LRU Page Replacement", "f": "set9_fifo_lru.py", "lang": "Python", "desc": "3 frames, 20-page reference string, page faults and hit ratio", "cmds": ["python3 set9_fifo_lru.py"], "inp": null, "notes": ["FIFO evicts the oldest page; LRU evicts the least recently used page.", "The algorithm with fewer page faults performs better (LRU)."], "var": false, "out": "Page reference string: [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1]\nNumber of frames     : 3\n\n====================================================\nFIFO Page Replacement\n====================================================\nRef  F1   F2   F3   Result\n----------------------------------------------------\n7    7    -    -    FAULT\n0    7    0    -    FAULT\n1    7    0    1    FAULT\n2    2    0    1    FAULT\n0    2    0    1    HIT\n3    2    3    1    FAULT\n0    2    3    0    FAULT\n4    4    3    0    FAULT\n2    4    2    0    FAULT\n3    4    2    3    FAULT\n0    0    2    3    FAULT\n3    0    2    3    HIT\n2    0    2    3    HIT\n1    0    1    3    FAULT\n2    0    1    2    FAULT\n0    0    1    2    HIT\n1    0    1    2    HIT\n7    7    1    2    FAULT\n0    7    0    2    FAULT\n1    7    0    1    FAULT\n----------------------------------------------------\nTotal references : 20\nPage faults      : 15\nPage hits        : 5\nHit ratio        : 5/20 = 0.25  (25.0%)\nFault ratio      : 15/20 = 0.75\n\n====================================================\nLRU Page Replacement\n====================================================\nRef  F1   F2   F3   Result\n----------------------------------------------------\n7    7    -    -    FAULT\n0    7    0    -    FAULT\n1    7    0    1    FAULT\n2    2    0    1    FAULT\n0    2    0    1    HIT\n3    2    0    3    FAULT\n0    2    0    3    HIT\n4    4    0    3    FAULT\n2    4    0    2    FAULT\n3    4    3    2    FAULT\n0    0    3    2    FAULT\n3    0    3    2    HIT\n2    0    3    2    HIT\n1    1    3    2    FAULT\n2    1    3    2    HIT\n0    1    0    2    FAULT\n1    1    0    2    HIT\n7    1    0    7    FAULT\n0    1    0    7    HIT\n1    1    0    7    HIT\n----------------------------------------------------\nTotal references : 20\nPage faults      : 12\nPage hits        : 8\nHit ratio        : 8/20 = 0.40  (40.0%)\nFault ratio      : 12/20 = 0.60\n\n====================================================\nCOMPARISON\n====================================================\nAlgorithm   Faults    Hit ratio \nFIFO        15        0.25      \nLRU         12        0.40      \n\nLRU performs better (fewer page faults, higher hit ratio)."}, {"n": 10, "g": "C", "t": "Optimal Page Replacement", "f": "set10_optimal.py", "lang": "Python", "desc": "Reference string of 12 pages with 3 frames and 4 frames", "cmds": ["python3 set10_optimal.py"], "inp": null, "notes": ["Optimal evicts the page whose next use is farthest in the future.", "It needs knowledge of future references, so it cannot be implemented in a real OS – it is used as a benchmark."], "var": false, "out": "Page reference string: [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]\n\n========================================================\nOptimal Page Replacement - 3 frames\n========================================================\nRef  F1   F2   F3   Result\n--------------------------------------------------------\n1    1    -    -    FAULT\n2    1    2    -    FAULT\n3    1    2    3    FAULT\n4    1    2    4    FAULT\n1    1    2    4    HIT\n2    1    2    4    HIT\n5    1    2    5    FAULT\n1    1    2    5    HIT\n2    1    2    5    HIT\n3    3    2    5    FAULT\n4    4    2    5    FAULT\n5    4    2    5    HIT\n--------------------------------------------------------\nTotal references : 12\nPage faults      : 7\nPage hits        : 5\nHit ratio        : 5/12 = 0.42  (41.7%)\n\n========================================================\nOptimal Page Replacement - 4 frames\n========================================================\nRef  F1   F2   F3   F4   Result\n--------------------------------------------------------\n1    1    -    -    -    FAULT\n2    1    2    -    -    FAULT\n3    1    2    3    -    FAULT\n4    1    2    3    4    FAULT\n1    1    2    3    4    HIT\n2    1    2    3    4    HIT\n5    1    2    3    5    FAULT\n1    1    2    3    5    HIT\n2    1    2    3    5    HIT\n3    1    2    3    5    HIT\n4    4    2    3    5    FAULT\n5    4    2    3    5    HIT\n--------------------------------------------------------\nTotal references : 12\nPage faults      : 6\nPage hits        : 6\nHit ratio        : 6/12 = 0.50  (50.0%)\n\n========================================================\nSUMMARY\n========================================================\nFrames    Faults    Hit ratio \n3         7         0.42      \n4         6         0.50      \n\nWhy the Optimal policy is not implementable in a real OS:\n  Optimal replaces the page whose next use is farthest in the future. This needs\n  advance knowledge of the entire future page-reference string, which an operating\n  system cannot know because it depends on run-time program behaviour and user input.\n  It is therefore used only as a theoretical benchmark to measure practical\n  algorithms such as FIFO, LRU and Clock."}];

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(s){return esc(s).replace(/\b(HIT|SAFE|GRANTED|granted|Granted|YES)\b/g,'<span class="hl-g">$1</span>').replace(/\b(FAULT|DENIED|denied|Denied|UNSAFE|NOT SAFE|Unallocated|unallocated)\b/g,'<span class="hl-r">$1</span>').replace(/^(={3,}.*|-{5,})$/gm,'<span class="hl-h">$1</span>')}

let K=0;
const blk=(txt,lbl="bash")=>{const id="b"+(++K);return `<div class="term" style="margin:8px 0"><div class="hd"><span>${lbl}</span><button class="cp" data-c="${id}">copy</button></div><pre id="${id}">${txt.split("\n").map(c=>c.startsWith("#")?`<span class="mut"># ${esc(c.slice(1).trim())}</span>`:`<span class="pr">$</span> <span class="cm">${esc(c)}</span>`).join("\n")}</pre></div>`};
const L={C:{name:"C",tool:"GCC compiler",verify:"gcc --version",
 linux:"sudo apt update\nsudo apt install build-essential -y",
 win:"# Sets 1 and 4 use fork(), wait(), exec() and POSIX threads, so they need Linux.\n# Open PowerShell as Administrator and run:\nwsl --install\n# Restart the PC, open 'Ubuntu' from the Start menu, then run the Linux commands above.",
 mac:"xcode-select --install"},
 Python:{name:"Python",tool:"Python 3",verify:"python3 --version",
 linux:"sudo apt update\nsudo apt install python3 -y",
 win:"# Download Python 3 from https://www.python.org/downloads/\n# Tick 'Add python.exe to PATH' on the first screen, then Install.\n# In Command Prompt use 'python' instead of 'python3':\npython --version",
 mac:"brew install python3\n# or download the installer from python.org"},
 Java:{name:"Java",tool:"JDK 11 or newer (21 recommended)",verify:"javac -version",
 linux:"sudo apt update\nsudo apt install default-jdk -y",
 win:"# Download JDK 21 (Temurin) from https://adoptium.net and install it.\n# Tick 'Set JAVA_HOME' and 'Add to PATH' in the installer, then reopen Command Prompt:\njavac -version",
 mac:"brew install openjdk\n# or download the JDK from adoptium.net"}};
function setup(){$("#wrap").classList.add("detail");list(-1);
$("#main").innerHTML=`<div class="tab"><button class="back" id="bk">← Sets</button><span class="t">SETUP – what to install</span></div><div class="pad">
<h2>Setup – What to install</h2><p class="sub">You need only three things: a C compiler, Python 3 and a Java JDK. Install once, then every set will run.</p>
<table class="tb"><tr><th>Language</th><th>Install</th><th>Used in</th></tr>
<tr><td>C</td><td>GCC compiler</td><td>Set 1, Set 4</td></tr>
<tr><td>Python</td><td>Python 3</td><td>Sets 2, 3, 6, 7, 8, 9, 10</td></tr>
<tr><td>Java</td><td>JDK 11+</td><td>Set 5</td></tr></table>
<div class="warn">Recommended OS: Ubuntu / Linux. Windows users should install WSL (Ubuntu) for the C programs – Sets 1 and 4 will not compile on plain Windows.</div>
<h4>OPTIONAL: CODE EDITOR</h4><p>Any editor works: VS Code (code.visualstudio.com), or nano / gedit on Linux.</p>
${Object.values(L).map(x=>`<h4>${x.name.toUpperCase()} – INSTALL ${x.tool.toUpperCase()}</h4>
<b>Ubuntu / Linux / WSL</b>${blk(x.linux)}<b>Windows</b>${blk(x.win)}<b>macOS</b>${blk(x.mac)}<b>Verify the install</b>${blk(x.verify)}`).join("")}
</div>`;$("#bk").onclick=()=>{location.hash=""};$("#main").scrollTop=0}
function list(sel){let h="",g="";D.forEach(d=>{if(d.g!==g){g=d.g;h+=`<div class="grp">▾ ${G[g]}</div>`}
h+=`<button class="item${d.n===sel?" on":""}" data-n="${d.n}"><span class="no">SET ${d.n}</span> · Q.1<small>${d.t} · <b>${d.lang}</b></small></button>`});$("#list").innerHTML=`<button class="item${sel===-1?" on":""}" data-n="setup"><span class="no">SETUP</span> · Install guide<small>What to install (C, Python, Java)</small></button>`+h}
function show(n){const d=D.find(x=>x.n===n);
if(!d){$("#wrap").classList.remove("detail");list(0);$("#main").innerHTML=`<div class="welcome"><h1>&gt; Select a set from the list</h1>Click <b>SETUP</b> first to see what to install, then any of the 10 sets on the left to see how to compile / run it and the expected output.<br><br><span class="pr">$</span> _</div>`;return}
$("#wrap").classList.add("detail");list(n);
const cmds=d.cmds.map(c=>`<span class="pr">$</span> <span class="cm">${esc(c)}</span>`).join("\n");
$("#main").innerHTML=`<div class="tab"><button class="back" id="bk">← Sets</button><span class="t">${d.f}</span></div><div class="pad">
<h2>SET ${d.n} · Q.1 – ${d.t}</h2><p class="sub"><span class="badge">${G[d.g].split(" – ")[0]}</span><span class="badge">Language: ${d.lang}</span>30 marks · ${d.desc}</p>
<h4>STEP-BY-STEP PROCESS</h4>
<div class="warn" style="margin:0 0 10px">Language: <b>${d.lang}</b> · Install: <b>${L[d.lang].tool}</b> · <a href="#setup">how to install</a>${d.lang==="C"?" · Linux / WSL required":""}</div>
<ol class="steps">
<li><b>Install ${L[d.lang].tool}</b> (one time) and verify it:${blk(L[d.lang].verify)}</li>
<li><b>Create a folder</b> and open a terminal in it:${blk("mkdir os_practical\ncd os_practical")}</li>
<li><b>Save the code</b> in a file named exactly <b>${d.f}</b>${d.lang==="Java"?" (the file name must match the class name <b>ReaderWriterDemo</b>)":""}. Paste your code and save:${blk("nano "+d.f+"\n# paste the code, press Ctrl+O, Enter, then Ctrl+X to save")}</li>
${d.lang==="Python"?`<li><b>Run the program:</b>${blk(d.cmds[0])}${"<small>On Windows use <b>python</b> instead of <b>python3</b>.</small>"}</li>`:`<li><b>Compile the program:</b>${blk(d.cmds[0])}</li><li><b>Run the program:</b>${blk(d.cmds[1])}${d.inp?"<small>"+esc(d.inp)+"</small>":""}</li>`}
<li><b>Compare</b> your screen with the expected output below, then note the result in your Conclusion.</li>
</ol>
<h4>EXPECTED OUTPUT</h4>
<div class="term"><div class="hd"><span>output</span><button class="cp" data-c="out">copy</button></div><pre id="out">${hl(d.out)}</pre></div>
${d.var?`<div class="warn">Output varies slightly on every run (${d.n===1?"PIDs, dates and file sizes":"thread timing and order"}). This is normal.</div>`:""}
<h4>WHAT TO OBSERVE</h4><ul>${d.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
$("#bk").onclick=()=>{location.hash=""};$("#main").scrollTop=0}
document.addEventListener("click",e=>{const i=e.target.closest(".item");if(i)location.hash=i.dataset.n==="setup"?"setup":"set"+i.dataset.n;
const c=e.target.closest(".cp");if(c){const t=document.getElementById(c.dataset.c).innerText;const ok=()=>{c.textContent="copied";setTimeout(()=>c.textContent="copy",1200)};
try{navigator.clipboard.writeText(t).then(ok,ok)}catch(_){ok()}}});
function route(){if(location.hash==="#setup"){setup();return}const m=/^#set(\d+)$/.exec(location.hash);show(m?+m[1]:0)}
addEventListener("hashchange",route);route();
</script></body></html>
