<script>
const D=[{"code": "/*\n * JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n * SET 1  |  Q.1 (30 Marks)  |  Group A - System Calls\n * Programme: B.Tech - Computer Science and Engineering\n *\n * Question Statement:\n * Write a C program for Linux to demonstrate Unix system calls as follows: (i)\n * Process management: create a child process using fork(); display the process\n * ID and parent process ID of both processes using getpid() and getppid();\n * make the parent wait using wait(); and replace the child image with the ls\n * -l command using exec(). (ii) File management: create a file using open(),\n * write a few lines into it using write(), read the contents back using read()\n * and close the file using close(). (iii) Input/Output: read a string from the\n * keyboard using read() and display it on the screen using write().\n */\n/* SET 1 : Unix system calls - process management, file management, I/O */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <fcntl.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint main(void)\n{\n    setvbuf(stdout, NULL, _IONBF, 0);    /* unbuffered: keeps printf and write() output in order */\n\n    /* ---------- (i) PROCESS MANAGEMENT ---------- */\n    printf(\"=== (i) Process Management ===\\n\");\n\n    pid_t pid = fork();\n\n    if (pid < 0) {\n        perror(\"fork failed\");\n        return 1;\n    }\n    else if (pid == 0) {                 /* CHILD */\n        printf(\"Child  : PID = %d, PPID = %d\\n\", getpid(), getppid());\n        printf(\"Child  : replacing my image with 'ls -l' using exec()\\n\");\n        execlp(\"ls\", \"ls\", \"-l\", (char *)NULL);\n        perror(\"exec failed\");           /* reached only if exec fails */\n        _exit(1);\n    }\n    else {                               /* PARENT */\n        int status;\n        printf(\"Parent : PID = %d, PPID = %d, Child PID = %d\\n\",\n               getpid(), getppid(), pid);\n        printf(\"Parent : waiting for child using wait()...\\n\");\n        wait(&status);\n        printf(\"Parent : child finished (exit status = %d)\\n\\n\",\n               WEXITSTATUS(status));\n    }\n\n    /* ---------- (ii) FILE MANAGEMENT ---------- */\n    printf(\"=== (ii) File Management ===\\n\");\n    const char *text = \"Line 1: Operating System Practical\\n\"\n                       \"Line 2: Unix system calls\\n\"\n                       \"Line 3: open, write, read, close\\n\";\n    char buffer[256];\n\n    int fd = open(\"sample.txt\", O_CREAT | O_RDWR | O_TRUNC, 0644);\n    if (fd < 0) {\n        perror(\"open failed\");\n        return 1;\n    }\n    printf(\"File 'sample.txt' created (fd = %d)\\n\", fd);\n\n    ssize_t w = write(fd, text, strlen(text));\n    printf(\"Bytes written : %zd\\n\", w);\n\n    lseek(fd, 0, SEEK_SET);              /* move offset back to the start */\n\n    ssize_t r = read(fd, buffer, sizeof(buffer) - 1);\n    if (r < 0) {\n        perror(\"read failed\");\n        close(fd);\n        return 1;\n    }\n    buffer[r] = '\\0';\n    printf(\"Bytes read    : %zd\\nFile contents :\\n%s\", r, buffer);\n\n    close(fd);\n    printf(\"File closed.\\n\\n\");\n\n    /* ---------- (iii) INPUT / OUTPUT ---------- */\n    printf(\"=== (iii) Input/Output using read() and write() ===\\n\");\n    const char *prompt = \"Enter a string: \";\n    write(STDOUT_FILENO, prompt, strlen(prompt));\n\n    char input[100];\n    ssize_t n = read(STDIN_FILENO, input, sizeof(input) - 1);\n    if (n < 0) {\n        perror(\"read failed\");\n        return 1;\n    }\n    input[n] = '\\0';\n\n    const char *msg = \"You entered   : \";\n    write(STDOUT_FILENO, msg, strlen(msg));\n    write(STDOUT_FILENO, input, n);\n    if (n == 0 || input[n - 1] != '\\n')\n        write(STDOUT_FILENO, \"\\n\", 1);\n\n    return 0;\n}", "n": 1, "g": "A", "t": "System Calls", "f": "set1_system_calls.c", "lang": "C", "desc": "Unix system calls: fork/getpid/getppid/wait/exec, open/write/read/close, read/write I/O", "cmds": ["gcc set1_system_calls.c -o set1", "./set1"], "inp": "Type any string when it asks “Enter a string:”. Sample input used: Hello Operating System", "notes": ["Parent and child print their PID and PPID; the child PID is the parent's “Child PID”.", "exec() replaces the child with ls -l, so nothing after exec runs in the child.", "wait() makes the parent print its last line only after the child finishes."], "var": true, "out": "=== (i) Process Management ===\nParent : PID = 155, PPID = 118, Child PID = 156\nParent : waiting for child using wait()...\nChild  : PID = 156, PPID = 155\nChild  : replacing my image with 'ls -l' using exec()\ntotal 8\n-rw-r--r-- 1 root root 2 Nov 16 19:27 a.out\n-rw-r--r-- 1 root root 2 Nov 16 19:27 notes.txt\nParent : child finished (exit status = 0)\n\n=== (ii) File Management ===\nFile 'sample.txt' created (fd = 3)\nBytes written : 94\nBytes read    : 94\nFile contents :\nLine 1: Operating System Practical\nLine 2: Unix system calls\nLine 3: open, write, read, close\nFile closed.\n\n=== (iii) Input/Output using read() and write() ===\nEnter a string: You entered   : Hello Operating System"}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 2  |  Q.1 (30 Marks)  |  Group A - Process Scheduling (FCFS and SJF)\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Implement the FCFS and SJF (non-preemptive) scheduling algorithms for: P1:\n# AT=0, BT=6; P2: AT=1, BT=8; P3: AT=2, BT=7; P4: AT=3, BT=3; P5: AT=4, BT=4.\n# Display the Gantt chart, completion time, turnaround time and waiting time\n# of each process, and the average waiting time and average turnaround time\n# for both algorithms. Identify the optimal schedule.\n\"\"\"SET 2 : FCFS and SJF (non-preemptive) CPU scheduling\"\"\"\n\n# (name, arrival time, burst time)\nPROCESSES = [(\"P1\", 0, 6), (\"P2\", 1, 8), (\"P3\", 2, 7), (\"P4\", 3, 3), (\"P5\", 4, 4)]\n\n\ndef fcfs(procs):\n    order = sorted(procs, key=lambda p: (p[1], p[0]))\n    time, result, gantt = 0, {}, []\n    for name, at, bt in order:\n        if time < at:\n            gantt.append((\"Idle\", time, at))\n            time = at\n        start = time\n        time += bt\n        result[name] = (at, bt, time)\n        gantt.append((name, start, time))\n    return result, gantt\n\n\ndef sjf_non_preemptive(procs):\n    remaining = list(procs)\n    time, result, gantt = 0, {}, []\n    while remaining:\n        ready = [p for p in remaining if p[1] <= time]\n        if not ready:                                   # CPU idle\n            nxt = min(p[1] for p in remaining)\n            gantt.append((\"Idle\", time, nxt))\n            time = nxt\n            continue\n        # shortest burst first; tie -> earlier arrival, then name\n        name, at, bt = min(ready, key=lambda p: (p[2], p[1], p[0]))\n        start = time\n        time += bt\n        result[name] = (at, bt, time)\n        gantt.append((name, start, time))\n        remaining.remove((name, at, bt))\n    return result, gantt\n\n\ndef show(title, result, gantt):\n    print(f\"\\n{'=' * 60}\\n{title}\\n{'=' * 60}\")\n    print(\"Gantt Chart:\")\n    print(\"\".join(f\"| {n} \" for n, _, _ in gantt) + \"|\")\n    scale = str(gantt[0][1])\n    for n, _, e in gantt:\n        scale += str(e).rjust(len(f\"| {n} \"))\n    print(scale)\n    print(\"\\nTimeline: \" + \"  \".join(f\"{n}({s}-{e})\" for n, s, e in gantt))\n\n    print(f\"\\n{'Process':<9}{'AT':<5}{'BT':<5}{'CT':<5}{'TAT':<6}{'WT':<5}\")\n    print(\"-\" * 35)\n    tot_tat = tot_wt = 0\n    for name in sorted(result):\n        at, bt, ct = result[name]\n        tat, wt = ct - at, ct - at - bt\n        tot_tat += tat\n        tot_wt += wt\n        print(f\"{name:<9}{at:<5}{bt:<5}{ct:<5}{tat:<6}{wt:<5}\")\n    n = len(result)\n    print(\"-\" * 35)\n    print(f\"Average Turnaround Time = {tot_tat / n:.2f}\")\n    print(f\"Average Waiting Time    = {tot_wt / n:.2f}\")\n    return tot_wt / n, tot_tat / n\n\n\nif __name__ == \"__main__\":\n    r1, g1 = fcfs(PROCESSES)\n    wt1, tat1 = show(\"FCFS Scheduling\", r1, g1)\n\n    r2, g2 = sjf_non_preemptive(PROCESSES)\n    wt2, tat2 = show(\"SJF (Non-Preemptive) Scheduling\", r2, g2)\n\n    print(f\"\\n{'=' * 60}\\nCOMPARISON / OPTIMAL SCHEDULE\\n{'=' * 60}\")\n    print(f\"{'Algorithm':<12}{'Avg WT':<10}{'Avg TAT':<10}\")\n    print(f\"{'FCFS':<12}{wt1:<10.2f}{tat1:<10.2f}\")\n    print(f\"{'SJF':<12}{wt2:<10.2f}{tat2:<10.2f}\")\n    if wt1 < wt2:\n        best = \"FCFS\"\n    elif wt2 < wt1:\n        best = \"SJF (Non-Preemptive)\"\n    else:\n        best = \"Both (equal)\"\n    print(f\"\\nOptimal schedule: {best} (lowest average waiting time).\")", "n": 2, "g": "A", "t": "FCFS and SJF Scheduling", "f": "set2_fcfs_sjf.py", "lang": "Python", "desc": "FCFS and non-preemptive SJF with Gantt chart, CT, TAT, WT and averages", "cmds": ["python3 set2_fcfs_sjf.py"], "inp": null, "notes": ["Compare the average waiting time and turnaround time of both algorithms.", "The algorithm with the lower averages is the optimal schedule (SJF)."], "var": false, "out": "\n============================================================\nFCFS Scheduling\n============================================================\nGantt Chart:\n| P1 | P2 | P3 | P4 | P5 |\n0    6   14   21   24   28\n\nTimeline: P1(0-6)  P2(6-14)  P3(14-21)  P4(21-24)  P5(24-28)\n\nProcess  AT   BT   CT   TAT   WT   \n-----------------------------------\nP1       0    6    6    6     0    \nP2       1    8    14   13    5    \nP3       2    7    21   19    12   \nP4       3    3    24   21    18   \nP5       4    4    28   24    20   \n-----------------------------------\nAverage Turnaround Time = 16.60\nAverage Waiting Time    = 11.00\n\n============================================================\nSJF (Non-Preemptive) Scheduling\n============================================================\nGantt Chart:\n| P1 | P4 | P5 | P3 | P2 |\n0    6    9   13   20   28\n\nTimeline: P1(0-6)  P4(6-9)  P5(9-13)  P3(13-20)  P2(20-28)\n\nProcess  AT   BT   CT   TAT   WT   \n-----------------------------------\nP1       0    6    6    6     0    \nP2       1    8    28   27    19   \nP3       2    7    20   18    11   \nP4       3    3    9    6     3    \nP5       4    4    13   9     5    \n-----------------------------------\nAverage Turnaround Time = 13.20\nAverage Waiting Time    = 7.60\n\n============================================================\nCOMPARISON / OPTIMAL SCHEDULE\n============================================================\nAlgorithm   Avg WT    Avg TAT   \nFCFS        11.00     16.60     \nSJF         7.60      13.20     \n\nOptimal schedule: SJF (Non-Preemptive) (lowest average waiting time)."}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 3  |  Q.1 (30 Marks)  |  Group A - Process Scheduling (Round Robin and Priority)\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Implement Round Robin (time quantum = 3) and Priority (non-preemptive, lower\n# number = higher priority) scheduling for processes all arriving at time 0:\n# P1: BT=10, Pr=3; P2: BT=1, Pr=1; P3: BT=2, Pr=4; P4: BT=1, Pr=5; P5: BT=5,\n# Pr=2. Display the Gantt chart, turnaround time and waiting time of each\n# process, and the average waiting time and average turnaround time for both\n# algorithms. Identify the optimal schedule.\n\"\"\"SET 3 : Round Robin (time quantum = 3) and Priority (non-preemptive) scheduling\nAll processes arrive at time 0. Lower priority number = higher priority.\"\"\"\nfrom collections import deque\n\n# (name, arrival, burst, priority)\nPROCESSES = [(\"P1\", 0, 10, 3), (\"P2\", 0, 1, 1), (\"P3\", 0, 2, 4),\n             (\"P4\", 0, 1, 5), (\"P5\", 0, 5, 2)]\nQUANTUM = 3\n\n\ndef round_robin(procs, quantum):\n    remaining = {n: bt for n, _, bt, _ in procs}\n    queue = deque(n for n, _, _, _ in procs)          # all arrive at 0 -> FIFO order\n    time, completion, gantt = 0, {}, []\n    while queue:\n        name = queue.popleft()\n        run = min(quantum, remaining[name])\n        gantt.append((name, time, time + run))\n        time += run\n        remaining[name] -= run\n        if remaining[name] > 0:\n            queue.append(name)                         # back of the queue\n        else:\n            completion[name] = time\n    return completion, gantt\n\n\ndef priority_np(procs):\n    order = sorted(procs, key=lambda p: (p[3], p[1], p[0]))   # priority, then arrival\n    time, completion, gantt = 0, {}, []\n    for name, at, bt, _ in order:\n        time = max(time, at)\n        gantt.append((name, time, time + bt))\n        time += bt\n        completion[name] = time\n    return completion, gantt\n\n\ndef show(title, procs, completion, gantt):\n    print(f\"\\n{'=' * 62}\\n{title}\\n{'=' * 62}\")\n    print(\"Gantt Chart:\")\n    print(\"\".join(f\"| {n} \" for n, _, _ in gantt) + \"|\")\n    scale = str(gantt[0][1])\n    for n, _, e in gantt:\n        scale += str(e).rjust(len(f\"| {n} \"))\n    print(scale)\n\n    print(f\"\\n{'Process':<9}{'AT':<5}{'BT':<5}{'Pri':<5}{'CT':<5}{'TAT':<6}{'WT':<5}\")\n    print(\"-\" * 40)\n    tot_tat = tot_wt = 0\n    for name, at, bt, pr in sorted(procs):\n        ct = completion[name]\n        tat, wt = ct - at, ct - at - bt\n        tot_tat += tat\n        tot_wt += wt\n        print(f\"{name:<9}{at:<5}{bt:<5}{pr:<5}{ct:<5}{tat:<6}{wt:<5}\")\n    n = len(procs)\n    print(\"-\" * 40)\n    print(f\"Average Turnaround Time = {tot_tat / n:.2f}\")\n    print(f\"Average Waiting Time    = {tot_wt / n:.2f}\")\n    return tot_wt / n, tot_tat / n\n\n\nif __name__ == \"__main__\":\n    c1, g1 = round_robin(PROCESSES, QUANTUM)\n    wt1, tat1 = show(f\"Round Robin (Time Quantum = {QUANTUM})\", PROCESSES, c1, g1)\n\n    c2, g2 = priority_np(PROCESSES)\n    wt2, tat2 = show(\"Priority Scheduling (Non-Preemptive)\", PROCESSES, c2, g2)\n\n    print(f\"\\n{'=' * 62}\\nCOMPARISON / OPTIMAL SCHEDULE\\n{'=' * 62}\")\n    print(f\"{'Algorithm':<22}{'Avg WT':<10}{'Avg TAT':<10}\")\n    print(f\"{'Round Robin (q=3)':<22}{wt1:<10.2f}{tat1:<10.2f}\")\n    print(f\"{'Priority (non-pre.)':<22}{wt2:<10.2f}{tat2:<10.2f}\")\n    best = \"Round Robin\" if wt1 < wt2 else \"Priority\" if wt2 < wt1 else \"Both (equal)\"\n    print(f\"\\nOptimal schedule: {best} (lowest average waiting and turnaround time).\")", "n": 3, "g": "A", "t": "Round Robin and Priority Scheduling", "f": "set3_rr_priority.py", "lang": "Python", "desc": "Round Robin (TQ = 3) and non-preemptive Priority scheduling, all arrivals at 0", "cmds": ["python3 set3_rr_priority.py"], "inp": null, "notes": ["Lower priority number = higher priority.", "Compare average waiting and turnaround times to pick the better schedule."], "var": false, "out": "\n==============================================================\nRound Robin (Time Quantum = 3)\n==============================================================\nGantt Chart:\n| P1 | P2 | P3 | P4 | P5 | P1 | P5 | P1 | P1 |\n0    3    4    6    7   10   13   15   18   19\n\nProcess  AT   BT   Pri  CT   TAT   WT   \n----------------------------------------\nP1       0    10   3    19   19    9    \nP2       0    1    1    4    4     3    \nP3       0    2    4    6    6     4    \nP4       0    1    5    7    7     6    \nP5       0    5    2    15   15    10   \n----------------------------------------\nAverage Turnaround Time = 10.20\nAverage Waiting Time    = 6.40\n\n==============================================================\nPriority Scheduling (Non-Preemptive)\n==============================================================\nGantt Chart:\n| P2 | P5 | P1 | P3 | P4 |\n0    1    6   16   18   19\n\nProcess  AT   BT   Pri  CT   TAT   WT   \n----------------------------------------\nP1       0    10   3    16   16    6    \nP2       0    1    1    1    1     0    \nP3       0    2    4    18   18    16   \nP4       0    1    5    19   19    18   \nP5       0    5    2    6    6     1    \n----------------------------------------\nAverage Turnaround Time = 12.00\nAverage Waiting Time    = 8.20\n\n==============================================================\nCOMPARISON / OPTIMAL SCHEDULE\n==============================================================\nAlgorithm             Avg WT    Avg TAT   \nRound Robin (q=3)     6.40      10.20     \nPriority (non-pre.)   8.20      12.00     \n\nOptimal schedule: Round Robin (lowest average waiting and turnaround time)."}, {"code": "/*\n * JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n * SET 4  |  Q.1 (30 Marks)  |  Group B - Synchronization Using Semaphores\n * Programme: B.Tech - Computer Science and Engineering\n *\n * Question Statement:\n * Solve the Producer-Consumer problem with a bounded buffer of size 5 (C with\n * POSIX threads and semaphores, or Java Semaphore class). Use counting\n * semaphores empty and full and a binary semaphore mutex. Create two producer\n * threads and two consumer threads, each producing/consuming 5 items, and\n * display messages showing the buffer operations. Explain how the semaphores\n * avoid race conditions, buffer overflow and buffer underflow.\n */\n/* SET 4 : Producer-Consumer (bounded buffer, size 5) using POSIX threads + semaphores\n   Compile : gcc set4_producer_consumer.c -o pc -pthread\n   Run     : ./pc                                                              */\n#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n#include <semaphore.h>\n#include <unistd.h>\n\n#define BUFFER_SIZE     5\n#define NUM_PRODUCERS   2\n#define NUM_CONSUMERS   2\n#define ITEMS_PER_THREAD 5\n\nint buffer[BUFFER_SIZE];\nint in = 0, out = 0, count = 0;      /* count is only for display */\n\nsem_t empty;                         /* counts EMPTY slots  (init = 5) */\nsem_t full;                          /* counts FILLED slots (init = 0) */\nsem_t mutex;                         /* binary semaphore for mutual exclusion (init = 1) */\n\nvoid *producer(void *arg)\n{\n    int id = *(int *)arg;\n    for (int i = 1; i <= ITEMS_PER_THREAD; i++) {\n        int item = id * 100 + i;              /* e.g. P1 -> 101..105 */\n        usleep(rand() % 200000);              /* simulate production time */\n\n        sem_wait(&empty);                     /* wait for a free slot  (prevents overflow)  */\n        sem_wait(&mutex);                     /* enter critical section (prevents race)     */\n\n        buffer[in] = item;\n        printf(\"Producer %d produced item %d -> buffer[%d]  (items in buffer = %d)\\n\",\n               id, item, in, ++count);\n        in = (in + 1) % BUFFER_SIZE;\n\n        sem_post(&mutex);                     /* leave critical section */\n        sem_post(&full);                      /* one more filled slot   */\n    }\n    return NULL;\n}\n\nvoid *consumer(void *arg)\n{\n    int id = *(int *)arg;\n    for (int i = 1; i <= ITEMS_PER_THREAD; i++) {\n        sem_wait(&full);                      /* wait for an item (prevents underflow) */\n        sem_wait(&mutex);\n\n        int item = buffer[out];\n        printf(\"    Consumer %d consumed item %d <- buffer[%d]  (items in buffer = %d)\\n\",\n               id, item, out, --count);\n        out = (out + 1) % BUFFER_SIZE;\n\n        sem_post(&mutex);\n        sem_post(&empty);                     /* one more empty slot */\n\n        usleep(rand() % 300000);              /* simulate consumption time */\n    }\n    return NULL;\n}\n\nint main(void)\n{\n    pthread_t prod[NUM_PRODUCERS], cons[NUM_CONSUMERS];\n    int pid[NUM_PRODUCERS], cid[NUM_CONSUMERS];\n\n    sem_init(&empty, 0, BUFFER_SIZE);\n    sem_init(&full, 0, 0);\n    sem_init(&mutex, 0, 1);\n\n    printf(\"Producer-Consumer: buffer size = %d, %d producers, %d consumers, %d items each\\n\\n\",\n           BUFFER_SIZE, NUM_PRODUCERS, NUM_CONSUMERS, ITEMS_PER_THREAD);\n\n    for (int i = 0; i < NUM_PRODUCERS; i++) {\n        pid[i] = i + 1;\n        pthread_create(&prod[i], NULL, producer, &pid[i]);\n    }\n    for (int i = 0; i < NUM_CONSUMERS; i++) {\n        cid[i] = i + 1;\n        pthread_create(&cons[i], NULL, consumer, &cid[i]);\n    }\n\n    for (int i = 0; i < NUM_PRODUCERS; i++) pthread_join(prod[i], NULL);\n    for (int i = 0; i < NUM_CONSUMERS; i++) pthread_join(cons[i], NULL);\n\n    printf(\"\\nAll threads finished. Items left in buffer = %d\\n\", count);\n\n    sem_destroy(&empty);\n    sem_destroy(&full);\n    sem_destroy(&mutex);\n    return 0;\n}", "n": 4, "g": "B", "t": "Producer–Consumer (Semaphores)", "f": "set4_producer_consumer.c", "lang": "C", "desc": "Bounded buffer of size 5, 2 producers, 2 consumers, 5 items each, using empty/full/mutex", "cmds": ["gcc set4_producer_consumer.c -o set4 -pthread", "./set4"], "inp": null, "notes": ["Interleaving of producer and consumer lines differs on every run – this is normal.", "Items in buffer never goes below 0 or above 5 (no underflow or overflow).", "Always ends with “Items left in buffer = 0”."], "var": true, "out": "Producer-Consumer: buffer size = 5, 2 producers, 2 consumers, 5 items each\n\nProducer 1 produced item 101 -> buffer[0]  (items in buffer = 1)\n    Consumer 1 consumed item 101 <- buffer[0]  (items in buffer = 0)\nProducer 1 produced item 102 -> buffer[1]  (items in buffer = 1)\n    Consumer 2 consumed item 102 <- buffer[1]  (items in buffer = 0)\nProducer 2 produced item 201 -> buffer[2]  (items in buffer = 1)\nProducer 1 produced item 103 -> buffer[3]  (items in buffer = 2)\nProducer 2 produced item 202 -> buffer[4]  (items in buffer = 3)\n    Consumer 1 consumed item 201 <- buffer[2]  (items in buffer = 2)\nProducer 1 produced item 104 -> buffer[0]  (items in buffer = 3)\nProducer 1 produced item 105 -> buffer[1]  (items in buffer = 4)\nProducer 2 produced item 203 -> buffer[2]  (items in buffer = 5)\n    Consumer 2 consumed item 103 <- buffer[3]  (items in buffer = 4)\nProducer 2 produced item 204 -> buffer[3]  (items in buffer = 5)\n    Consumer 1 consumed item 202 <- buffer[4]  (items in buffer = 4)\n    Consumer 2 consumed item 104 <- buffer[0]  (items in buffer = 3)\n    Consumer 1 consumed item 105 <- buffer[1]  (items in buffer = 2)\nProducer 2 produced item 205 -> buffer[4]  (items in buffer = 3)\n    Consumer 2 consumed item 203 <- buffer[2]  (items in buffer = 2)\n    Consumer 1 consumed item 204 <- buffer[3]  (items in buffer = 1)\n    Consumer 2 consumed item 205 <- buffer[4]  (items in buffer = 0)\n\nAll threads finished. Items left in buffer = 0"}, {"code": "/*\n * JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n * SET 5  |  Q.1 (30 Marks)  |  Group B - Reader-Writer Synchronization Using Java Locks\n * Programme: B.Tech - Computer Science and Engineering\n *\n * Question Statement:\n * Implement the Reader-Writer synchronization problem in Java using\n * ReentrantReadWriteLock. Create a shared resource (a counter or a data\n * string), three reader threads and two writer threads. Readers may read\n * concurrently, whereas a writer must have exclusive access. Display messages\n * showing when each thread acquires and releases the read or write lock, and\n * explain how the locks ensure data consistency.\n */\n/* SET 5 : Reader-Writer synchronization using ReentrantReadWriteLock\n   Compile : javac ReaderWriterDemo.java\n   Run     : java ReaderWriterDemo                                          */\nimport java.util.concurrent.locks.ReentrantReadWriteLock;\n\npublic class ReaderWriterDemo {\n\n    private static int sharedCounter = 0;                        // shared resource\n    private static final ReentrantReadWriteLock rwLock = new ReentrantReadWriteLock();\n    private static final int ROUNDS = 2;                         // operations per thread\n\n    static void log(String msg) {\n        System.out.printf(\"[%5d ms] %s%n\", System.currentTimeMillis() - START, msg);\n    }\n    private static final long START = System.currentTimeMillis();\n\n    static class Reader extends Thread {\n        private final int id;\n        Reader(int id) { super(\"Reader-\" + id); this.id = id; }\n\n        @Override public void run() {\n            try {\n                for (int i = 0; i < ROUNDS; i++) {\n                    Thread.sleep((long) (Math.random() * 300));\n                    log(\"Reader \" + id + \" waiting for READ lock\");\n                    rwLock.readLock().lock();\n                    try {\n                        log(\"Reader \" + id + \" ACQUIRED read lock  (active readers = \"\n                                + rwLock.getReadLockCount() + \")\");\n                        log(\"Reader \" + id + \" reads counter = \" + sharedCounter);\n                        Thread.sleep(400);                       // reading takes time\n                    } finally {\n                        log(\"Reader \" + id + \" RELEASING read lock\");\n                        rwLock.readLock().unlock();\n                    }\n                }\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n            }\n        }\n    }\n\n    static class Writer extends Thread {\n        private final int id;\n        Writer(int id) { super(\"Writer-\" + id); this.id = id; }\n\n        @Override public void run() {\n            try {\n                for (int i = 0; i < ROUNDS; i++) {\n                    Thread.sleep((long) (Math.random() * 300));\n                    log(\"Writer \" + id + \" waiting for WRITE lock\");\n                    rwLock.writeLock().lock();\n                    try {\n                        log(\"Writer \" + id + \" ACQUIRED write lock (exclusive access)\");\n                        int old = sharedCounter;\n                        Thread.sleep(300);                       // writing takes time\n                        sharedCounter = old + 10;\n                        log(\"Writer \" + id + \" updated counter \" + old + \" -> \" + sharedCounter);\n                    } finally {\n                        log(\"Writer \" + id + \" RELEASING write lock\");\n                        rwLock.writeLock().unlock();\n                    }\n                }\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n            }\n        }\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        Thread[] threads = {\n            new Reader(1), new Reader(2), new Reader(3),\n            new Writer(1), new Writer(2)\n        };\n        for (Thread t : threads) t.start();\n        for (Thread t : threads) t.join();\n        System.out.println(\"\\nFinal value of shared counter = \" + sharedCounter\n                + \"  (expected 2 writers x \" + ROUNDS + \" updates x 10 = \" + (2 * ROUNDS * 10) + \")\");\n    }\n}", "n": 5, "g": "B", "t": "Reader–Writer (Java Locks)", "f": "ReaderWriterDemo.java", "lang": "Java", "desc": "ReentrantReadWriteLock with 3 readers and 2 writers", "cmds": ["javac ReaderWriterDemo.java", "java ReaderWriterDemo"], "inp": null, "notes": ["Several readers can hold the read lock together (active readers > 1).", "A writer gets exclusive access – no reader reads while a write lock is held.", "Timestamps differ per run, but the final counter is always 40 (2 writers × 2 updates × 10)."], "var": true, "out": "[   22 ms] Writer 1 waiting for WRITE lock\n[   41 ms] Writer 1 ACQUIRED write lock (exclusive access)\n[   47 ms] Writer 2 waiting for WRITE lock\n[  115 ms] Reader 1 waiting for READ lock\n[  195 ms] Reader 2 waiting for READ lock\n[  237 ms] Reader 3 waiting for READ lock\n[  352 ms] Writer 1 updated counter 0 -> 10\n[  352 ms] Writer 1 RELEASING write lock\n[  353 ms] Writer 2 ACQUIRED write lock (exclusive access)\n[  384 ms] Writer 1 waiting for WRITE lock\n[  653 ms] Writer 2 updated counter 10 -> 20\n[  653 ms] Writer 2 RELEASING write lock\n[  656 ms] Reader 1 ACQUIRED read lock  (active readers = 1)\n[  656 ms] Reader 1 reads counter = 20\n[  656 ms] Reader 3 ACQUIRED read lock  (active readers = 3)\n[  656 ms] Reader 3 reads counter = 20\n[  657 ms] Reader 2 ACQUIRED read lock  (active readers = 2)\n[  658 ms] Reader 2 reads counter = 20\n[  695 ms] Writer 2 waiting for WRITE lock\n[ 1057 ms] Reader 3 RELEASING read lock\n[ 1058 ms] Reader 1 RELEASING read lock\n[ 1058 ms] Reader 2 RELEASING read lock\n[ 1059 ms] Writer 1 ACQUIRED write lock (exclusive access)\n[ 1142 ms] Reader 1 waiting for READ lock\n[ 1148 ms] Reader 3 waiting for READ lock\n[ 1314 ms] Reader 2 waiting for READ lock\n[ 1360 ms] Writer 1 updated counter 20 -> 30\n[ 1360 ms] Writer 1 RELEASING write lock\n[ 1361 ms] Writer 2 ACQUIRED write lock (exclusive access)\n[ 1662 ms] Writer 2 updated counter 30 -> 40\n[ 1662 ms] Writer 2 RELEASING write lock\n[ 1662 ms] Reader 1 ACQUIRED read lock  (active readers = 1)\n[ 1663 ms] Reader 1 reads counter = 40\n[ 1662 ms] Reader 3 ACQUIRED read lock  (active readers = 2)\n[ 1663 ms] Reader 3 reads counter = 40\n[ 1662 ms] Reader 2 ACQUIRED read lock  (active readers = 3)\n[ 1664 ms] Reader 2 reads counter = 40\n[ 2063 ms] Reader 1 RELEASING read lock\n[ 2064 ms] Reader 3 RELEASING read lock\n[ 2064 ms] Reader 2 RELEASING read lock\n\nFinal value of shared counter = 40  (expected 2 writers x 2 updates x 10 = 40)"}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 6  |  Q.1 (30 Marks)  |  Group B - Memory Allocation Strategies\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Implement First Fit, Best Fit and Worst Fit memory allocation. Partitions\n# (KB): 100, 500, 200, 300, 600. Processes (KB): P1=212, P2=417, P3=112,\n# P4=426. Display the partition allocated to each process, the internal\n# fragmentation, and the processes that remain unallocated for each strategy.\n# Compare the three strategies and state which one utilizes memory best.\n\"\"\"SET 6 : First Fit, Best Fit and Worst Fit memory allocation (fixed partitions)\nOne partition holds at most one process; unused space inside it = internal fragmentation.\"\"\"\n\nPARTITIONS = [100, 500, 200, 300, 600]            # KB\nPROCESSES = [(\"P1\", 212), (\"P2\", 417), (\"P3\", 112), (\"P4\", 426)]   # KB\n\n\ndef allocate(strategy):\n    used = [False] * len(PARTITIONS)\n    rows = []                                       # (process, size, partition no, frag)\n    for name, size in PROCESSES:\n        candidates = [i for i, p in enumerate(PARTITIONS) if not used[i] and p >= size]\n        if not candidates:\n            rows.append((name, size, None, None))\n            continue\n        if strategy == \"First Fit\":\n            idx = candidates[0]\n        elif strategy == \"Best Fit\":\n            idx = min(candidates, key=lambda i: PARTITIONS[i])      # smallest that fits\n        else:                                                       # Worst Fit\n            idx = max(candidates, key=lambda i: PARTITIONS[i])      # largest partition\n        used[idx] = True\n        rows.append((name, size, idx, PARTITIONS[idx] - size))\n    return rows\n\n\ndef show(strategy):\n    rows = allocate(strategy)\n    print(f\"\\n{'=' * 64}\\n{strategy}\\n{'=' * 64}\")\n    print(f\"{'Process':<9}{'Size(KB)':<10}{'Partition':<22}{'Internal Frag(KB)':<18}\")\n    print(\"-\" * 59)\n    total_frag = allocated = 0\n    unallocated = []\n    for name, size, idx, frag in rows:\n        if idx is None:\n            print(f\"{name:<9}{size:<10}{'NOT ALLOCATED':<22}{'-':<18}\")\n            unallocated.append(name)\n        else:\n            print(f\"{name:<9}{size:<10}{f'Partition {idx + 1} ({PARTITIONS[idx]} KB)':<22}{frag:<18}\")\n            total_frag += frag\n            allocated += size\n    print(\"-\" * 59)\n    print(f\"Total internal fragmentation : {total_frag} KB\")\n    print(f\"Unallocated processes        : {', '.join(unallocated) if unallocated else 'None'}\")\n    util = allocated / sum(PARTITIONS) * 100\n    print(f\"Memory utilization           : {allocated}/{sum(PARTITIONS)} KB = {util:.2f}%\")\n    return len(unallocated), total_frag, util\n\n\nif __name__ == \"__main__\":\n    print(\"Memory partitions (KB):\", PARTITIONS)\n    print(\"Processes (KB)        :\", \", \".join(f\"{n}={s}\" for n, s in PROCESSES))\n\n    results = {s: show(s) for s in (\"First Fit\", \"Best Fit\", \"Worst Fit\")}\n\n    print(f\"\\n{'=' * 64}\\nCOMPARISON\\n{'=' * 64}\")\n    print(f\"{'Strategy':<12}{'Unallocated':<14}{'Int. Frag (KB)':<17}{'Utilization':<12}\")\n    for s, (un, fr, ut) in results.items():\n        print(f\"{s:<12}{un:<14}{fr:<17}{ut:.2f}%\")\n    best = min(results, key=lambda s: (results[s][0], results[s][1]))\n    print(f\"\\nBest strategy for the given data: {best} \"\n          f\"(fewest unallocated processes, highest memory utilization).\")", "n": 6, "g": "B", "t": "Memory Allocation (First / Best / Worst Fit)", "f": "set6_memory_allocation.py", "lang": "Python", "desc": "Fixed partitions 100, 500, 200, 300, 600 KB; processes 212, 417, 112, 426 KB", "cmds": ["python3 set6_memory_allocation.py"], "inp": null, "notes": ["Check which process stays unallocated in each strategy.", "The strategy that allocates all processes with the least fragmentation uses memory best."], "var": false, "out": "Memory partitions (KB): [100, 500, 200, 300, 600]\nProcesses (KB)        : P1=212, P2=417, P3=112, P4=426\n\n================================================================\nFirst Fit\n================================================================\nProcess  Size(KB)  Partition             Internal Frag(KB) \n-----------------------------------------------------------\nP1       212       Partition 2 (500 KB)  288               \nP2       417       Partition 5 (600 KB)  183               \nP3       112       Partition 3 (200 KB)  88                \nP4       426       NOT ALLOCATED         -                 \n-----------------------------------------------------------\nTotal internal fragmentation : 559 KB\nUnallocated processes        : P4\nMemory utilization           : 741/1700 KB = 43.59%\n\n================================================================\nBest Fit\n================================================================\nProcess  Size(KB)  Partition             Internal Frag(KB) \n-----------------------------------------------------------\nP1       212       Partition 4 (300 KB)  88                \nP2       417       Partition 2 (500 KB)  83                \nP3       112       Partition 3 (200 KB)  88                \nP4       426       Partition 5 (600 KB)  174               \n-----------------------------------------------------------\nTotal internal fragmentation : 433 KB\nUnallocated processes        : None\nMemory utilization           : 1167/1700 KB = 68.65%\n\n================================================================\nWorst Fit\n================================================================\nProcess  Size(KB)  Partition             Internal Frag(KB) \n-----------------------------------------------------------\nP1       212       Partition 5 (600 KB)  388               \nP2       417       Partition 2 (500 KB)  83                \nP3       112       Partition 4 (300 KB)  188               \nP4       426       NOT ALLOCATED         -                 \n-----------------------------------------------------------\nTotal internal fragmentation : 659 KB\nUnallocated processes        : P4\nMemory utilization           : 741/1700 KB = 43.59%\n\n================================================================\nCOMPARISON\n================================================================\nStrategy    Unallocated   Int. Frag (KB)   Utilization \nFirst Fit   1             559              43.59%\nBest Fit    0             433              68.65%\nWorst Fit   1             659              43.59%\n\nBest strategy for the given data: Best Fit (fewest unallocated processes, highest memory utilization)."}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 7  |  Q.1 (30 Marks)  |  Group C - Banker's Algorithm for Deadlock Avoidance\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Simulate the Banker's algorithm for 5 processes (P0-P4) and 3 resource types\n# (A,B,C). Allocation: P0=(0,1,0), P1=(2,0,0), P2=(3,0,2), P3=(2,1,1),\n# P4=(0,0,2). Maximum: P0=(7,5,3), P1=(3,2,2), P2=(9,0,2), P3=(2,2,2),\n# P4=(4,3,3). Available: (3,3,2). Calculate the Need matrix, check whether the\n# system is in a safe state and display the safe sequence. Then check whether\n# a request by P1 for (1,0,2) can be granted immediately.\n\"\"\"SET 7 : Banker's algorithm - deadlock AVOIDANCE\nNeed matrix, safe-state check, safe sequence, and a resource request by P1 = (1,0,2).\"\"\"\n\nALLOCATION = [[0, 1, 0], [2, 0, 0], [3, 0, 2], [2, 1, 1], [0, 0, 2]]\nMAXIMUM    = [[7, 5, 3], [3, 2, 2], [9, 0, 2], [2, 2, 2], [4, 3, 3]]\nAVAILABLE  = [3, 3, 2]\nRESOURCES  = [\"A\", \"B\", \"C\"]\n\n\ndef calc_need(maximum, allocation):\n    return [[m - a for m, a in zip(mr, ar)] for mr, ar in zip(maximum, allocation)]\n\n\ndef is_safe(allocation, need, available):\n    \"\"\"Safety algorithm. Returns (is_safe, safe_sequence).\"\"\"\n    n, m = len(allocation), len(available)\n    work, finish, sequence = available[:], [False] * n, []\n    while len(sequence) < n:\n        found = False\n        for i in range(n):\n            if not finish[i] and all(need[i][j] <= work[j] for j in range(m)):\n                work = [work[j] + allocation[i][j] for j in range(m)]   # P(i) finishes, releases\n                finish[i] = True\n                sequence.append(i)\n                found = True\n        if not found:\n            break\n    return all(finish), sequence\n\n\ndef request_resources(pid, request, allocation, need, available):\n    \"\"\"Resource-request algorithm. Returns (granted, reason).\"\"\"\n    m = len(available)\n    if any(request[j] > need[pid][j] for j in range(m)):\n        return False, \"Request > Need (process exceeded its maximum claim)\"\n    if any(request[j] > available[j] for j in range(m)):\n        return False, \"Request > Available (resources not available, process must wait)\"\n    # pretend to allocate\n    new_avail = [available[j] - request[j] for j in range(m)]\n    new_alloc = [row[:] for row in allocation]\n    new_need = [row[:] for row in need]\n    for j in range(m):\n        new_alloc[pid][j] += request[j]\n        new_need[pid][j] -= request[j]\n    safe, seq = is_safe(new_alloc, new_need, new_avail)\n    if safe:\n        return True, \"System stays SAFE. Safe sequence: \" + \" -> \".join(f\"P{i}\" for i in seq)\n    return False, \"Granting it would leave the system in an UNSAFE state\"\n\n\ndef print_table(allocation, maximum, need, available):\n    n = len(allocation)\n    hdr = lambda t: \"\".join(f\"{t + r:<4}\" for r in RESOURCES)\n    print(f\"{'Process':<9}{hdr('Al')}   {hdr('Mx')}   {hdr('Nd')}\")\n    print(\"-\" * 45)\n    for i in range(n):\n        print(f\"{'P' + str(i):<9}{''.join(f'{v:<4}' for v in allocation[i])}   \"\n              f\"{''.join(f'{v:<4}' for v in maximum[i])}   {''.join(f'{v:<4}' for v in need[i])}\")\n    print(f\"\\nAvailable = {tuple(available)}\")\n\n\nif __name__ == \"__main__\":\n    need = calc_need(MAXIMUM, ALLOCATION)\n    print(\"Allocation / Maximum / Need matrices\")\n    print_table(ALLOCATION, MAXIMUM, need, AVAILABLE)\n\n    print(\"\\n--- Safety check of the initial state ---\")\n    safe, seq = is_safe(ALLOCATION, need, AVAILABLE)\n    if safe:\n        print(\"System is in a SAFE state.\")\n        print(\"Safe sequence: <\" + \", \".join(f\"P{i}\" for i in seq) + \">\")\n    else:\n        print(\"System is in an UNSAFE state.\")\n\n    print(\"\\n--- Resource request: P1 requests (1,0,2) ---\")\n    granted, reason = request_resources(1, [1, 0, 2], ALLOCATION, need, AVAILABLE)\n    print(\"Request GRANTED immediately.\" if granted else \"Request DENIED.\")\n    print(\"Reason:\", reason)", "n": 7, "g": "C", "t": "Banker's Algorithm – Avoidance", "f": "set7_bankers_safety_request.py", "lang": "Python", "desc": "Need matrix, safe state, safe sequence and request P1 = (1,0,2)", "cmds": ["python3 set7_bankers_safety_request.py"], "inp": null, "notes": ["Need = Maximum − Allocation.", "Safe sequence shows the order in which all processes can finish.", "The request is granted only if it is ≤ Need, ≤ Available and the new state is safe."], "var": false, "out": "Allocation / Maximum / Need matrices\nProcess  AlA AlB AlC    MxA MxB MxC    NdA NdB NdC \n---------------------------------------------\nP0       0   1   0      7   5   3      7   4   3   \nP1       2   0   0      3   2   2      1   2   2   \nP2       3   0   2      9   0   2      6   0   0   \nP3       2   1   1      2   2   2      0   1   1   \nP4       0   0   2      4   3   3      4   3   1   \n\nAvailable = (3, 3, 2)\n\n--- Safety check of the initial state ---\nSystem is in a SAFE state.\nSafe sequence: <P1, P3, P4, P0, P2>\n\n--- Resource request: P1 requests (1,0,2) ---\nRequest GRANTED immediately.\nReason: System stays SAFE. Safe sequence: P1 -> P3 -> P4 -> P0 -> P2"}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 8  |  Q.1 (30 Marks)  |  Group C - Banker's Algorithm for Deadlock Prevention\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Simulate the Banker's algorithm for 4 processes (P0-P3) and 3 resource types\n# (A,B,C). Allocation: P0=(0,1,0), P1=(2,0,0), P2=(3,0,3), P3=(2,1,1).\n# Maximum: P0=(7,5,3), P1=(3,2,2), P2=(9,0,6), P3=(2,2,2). Available: (3,3,2).\n# Calculate the Need matrix and verify the initial state is safe. Then process\n# each request independently with the resource-request algorithm and display\n# whether it is granted or denied with the reason: (a) P1 requests (1,0,2);\n# (b) P0 requests (0,2,0); (c) P2 requests (4,0,1).\n\"\"\"SET 8 : Banker's algorithm - deadlock PREVENTION (resource-request algorithm)\n4 processes, 3 resource types. Each request is processed independently on the initial state.\"\"\"\n\nALLOCATION = [[0, 1, 0], [2, 0, 0], [3, 0, 3], [2, 1, 1]]\nMAXIMUM    = [[7, 5, 3], [3, 2, 2], [9, 0, 6], [2, 2, 2]]\nAVAILABLE  = [3, 3, 2]\nRESOURCES  = [\"A\", \"B\", \"C\"]\nREQUESTS   = [(\"a\", 1, [1, 0, 2]), (\"b\", 0, [0, 2, 0]), (\"c\", 2, [4, 0, 1])]   # (label, pid, request)\n\n\ndef calc_need(maximum, allocation):\n    return [[m - a for m, a in zip(mr, ar)] for mr, ar in zip(maximum, allocation)]\n\n\ndef is_safe(allocation, need, available):\n    n, m = len(allocation), len(available)\n    work, finish, sequence = available[:], [False] * n, []\n    while len(sequence) < n:\n        found = False\n        for i in range(n):\n            if not finish[i] and all(need[i][j] <= work[j] for j in range(m)):\n                work = [work[j] + allocation[i][j] for j in range(m)]\n                finish[i] = True\n                sequence.append(i)\n                found = True\n        if not found:\n            break\n    return all(finish), sequence\n\n\ndef request_resources(pid, request, allocation, need, available):\n    m = len(available)\n    if any(request[j] > need[pid][j] for j in range(m)):\n        return False, f\"DENIED: Request {tuple(request)} > Need {tuple(need[pid])} (exceeds maximum claim)\"\n    if any(request[j] > available[j] for j in range(m)):\n        return False, f\"DENIED: Request {tuple(request)} > Available {tuple(available)} (process must wait)\"\n    new_avail = [available[j] - request[j] for j in range(m)]\n    new_alloc = [row[:] for row in allocation]\n    new_need = [row[:] for row in need]\n    for j in range(m):\n        new_alloc[pid][j] += request[j]\n        new_need[pid][j] -= request[j]\n    safe, seq = is_safe(new_alloc, new_need, new_avail)\n    if safe:\n        return True, (\"GRANTED: state after allocation is SAFE, safe sequence = \"\n                      + \" -> \".join(f\"P{i}\" for i in seq))\n    return False, \"DENIED: allocation would put the system in an UNSAFE state (possible deadlock)\"\n\n\nif __name__ == \"__main__\":\n    need = calc_need(MAXIMUM, ALLOCATION)\n    hdr = lambda t: \"\".join(f\"{t + r:<4}\" for r in RESOURCES)\n    print(f\"{'Process':<9}{hdr('Al')}   {hdr('Mx')}   {hdr('Nd')}\")\n    print(\"-\" * 45)\n    for i in range(len(ALLOCATION)):\n        print(f\"{'P' + str(i):<9}{''.join(f'{v:<4}' for v in ALLOCATION[i])}   \"\n              f\"{''.join(f'{v:<4}' for v in MAXIMUM[i])}   {''.join(f'{v:<4}' for v in need[i])}\")\n    print(f\"\\nAvailable = {tuple(AVAILABLE)}\")\n\n    print(\"\\n--- Initial state safety check ---\")\n    safe, seq = is_safe(ALLOCATION, need, AVAILABLE)\n    print(\"Initial state is\", \"SAFE\" if safe else \"UNSAFE\")\n    if safe:\n        print(\"Safe sequence: <\" + \", \".join(f\"P{i}\" for i in seq) + \">\")\n\n    print(\"\\n--- Resource requests (each processed independently) ---\")\n    for label, pid, req in REQUESTS:\n        granted, reason = request_resources(pid, req, ALLOCATION, need, AVAILABLE)\n        print(f\"({label}) P{pid} requests {tuple(req)}  ->  {reason}\")", "n": 8, "g": "C", "t": "Banker's Algorithm – Prevention", "f": "set8_bankers_prevention.py", "lang": "Python", "desc": "Initial safety check, then requests (a) P1 (1,0,2), (b) P0 (0,2,0), (c) P2 (4,0,1)", "cmds": ["python3 set8_bankers_prevention.py"], "inp": null, "notes": ["Each request is tested independently on the initial state.", "A request is denied if it exceeds Need, exceeds Available, or leads to an unsafe state."], "var": false, "out": "Process  AlA AlB AlC    MxA MxB MxC    NdA NdB NdC \n---------------------------------------------\nP0       0   1   0      7   5   3      7   4   3   \nP1       2   0   0      3   2   2      1   2   2   \nP2       3   0   3      9   0   6      6   0   3   \nP3       2   1   1      2   2   2      0   1   1   \n\nAvailable = (3, 3, 2)\n\n--- Initial state safety check ---\nInitial state is SAFE\nSafe sequence: <P1, P3, P0, P2>\n\n--- Resource requests (each processed independently) ---\n(a) P1 requests (1, 0, 2)  ->  GRANTED: state after allocation is SAFE, safe sequence = P1 -> P3 -> P0 -> P2\n(b) P0 requests (0, 2, 0)  ->  GRANTED: state after allocation is SAFE, safe sequence = P3 -> P1 -> P2 -> P0\n(c) P2 requests (4, 0, 1)  ->  DENIED: Request (4, 0, 1) > Available (3, 3, 2) (process must wait)"}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 9  |  Q.1 (30 Marks)  |  Group C - FIFO and LRU Page Replacement\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Simulate FIFO and LRU page replacement with 3 frames for the reference\n# string: 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1. Display\n# the frame contents after each reference, mark each reference as a page hit\n# or fault, and display the total page faults and hit ratio for both\n# algorithms. State which algorithm performs better.\n\"\"\"SET 9 : FIFO and LRU page replacement (3 frames)\"\"\"\n\nPAGES = [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1]\nFRAMES = 3\n\n\ndef print_header(title):\n    print(f\"\\n{'=' * 52}\\n{title}\\n{'=' * 52}\")\n    print(f\"{'Ref':<5}\" + \"\".join(f\"{'F' + str(i + 1):<5}\" for i in range(FRAMES)) + \"Result\")\n    print(\"-\" * 52)\n\n\ndef print_row(page, frames, hit):\n    cells = \"\".join(f\"{('-' if f is None else f):<5}\" for f in frames)\n    print(f\"{page:<5}{cells}{'HIT' if hit else 'FAULT'}\")\n\n\ndef summary(name, faults):\n    hits = len(PAGES) - faults\n    ratio = hits / len(PAGES)\n    print(\"-\" * 52)\n    print(f\"Total references : {len(PAGES)}\")\n    print(f\"Page faults      : {faults}\")\n    print(f\"Page hits        : {hits}\")\n    print(f\"Hit ratio        : {hits}/{len(PAGES)} = {ratio:.2f}  ({ratio * 100:.1f}%)\")\n    print(f\"Fault ratio      : {faults}/{len(PAGES)} = {faults / len(PAGES):.2f}\")\n    return faults, ratio\n\n\ndef fifo():\n    print_header(\"FIFO Page Replacement\")\n    frames, pointer, faults = [None] * FRAMES, 0, 0     # pointer = oldest page (next victim)\n    for page in PAGES:\n        hit = page in frames\n        if not hit:\n            faults += 1\n            frames[pointer] = page\n            pointer = (pointer + 1) % FRAMES\n        print_row(page, frames, hit)\n    return summary(\"FIFO\", faults)\n\n\ndef lru():\n    print_header(\"LRU Page Replacement\")\n    frames, last_used, faults = [None] * FRAMES, {}, 0\n    for time, page in enumerate(PAGES):\n        hit = page in frames\n        if not hit:\n            faults += 1\n            if None in frames:                          # free frame available\n                frames[frames.index(None)] = page\n            else:                                       # evict least recently used page\n                victim = min(frames, key=lambda p: last_used[p])\n                frames[frames.index(victim)] = page\n        last_used[page] = time\n        print_row(page, frames, hit)\n    return summary(\"LRU\", faults)\n\n\nif __name__ == \"__main__\":\n    print(\"Page reference string:\", PAGES)\n    print(\"Number of frames     :\", FRAMES)\n\n    f_faults, f_ratio = fifo()\n    l_faults, l_ratio = lru()\n\n    print(f\"\\n{'=' * 52}\\nCOMPARISON\\n{'=' * 52}\")\n    print(f\"{'Algorithm':<12}{'Faults':<10}{'Hit ratio':<10}\")\n    print(f\"{'FIFO':<12}{f_faults:<10}{f_ratio:<10.2f}\")\n    print(f\"{'LRU':<12}{l_faults:<10}{l_ratio:<10.2f}\")\n    if f_faults < l_faults:\n        print(\"\\nFIFO performs better (fewer page faults).\")\n    elif l_faults < f_faults:\n        print(\"\\nLRU performs better (fewer page faults, higher hit ratio).\")\n    else:\n        print(\"\\nBoth algorithms perform equally.\")", "n": 9, "g": "C", "t": "FIFO and LRU Page Replacement", "f": "set9_fifo_lru.py", "lang": "Python", "desc": "3 frames, 20-page reference string, page faults and hit ratio", "cmds": ["python3 set9_fifo_lru.py"], "inp": null, "notes": ["FIFO evicts the oldest page; LRU evicts the least recently used page.", "The algorithm with fewer page faults performs better (LRU)."], "var": false, "out": "Page reference string: [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1]\nNumber of frames     : 3\n\n====================================================\nFIFO Page Replacement\n====================================================\nRef  F1   F2   F3   Result\n----------------------------------------------------\n7    7    -    -    FAULT\n0    7    0    -    FAULT\n1    7    0    1    FAULT\n2    2    0    1    FAULT\n0    2    0    1    HIT\n3    2    3    1    FAULT\n0    2    3    0    FAULT\n4    4    3    0    FAULT\n2    4    2    0    FAULT\n3    4    2    3    FAULT\n0    0    2    3    FAULT\n3    0    2    3    HIT\n2    0    2    3    HIT\n1    0    1    3    FAULT\n2    0    1    2    FAULT\n0    0    1    2    HIT\n1    0    1    2    HIT\n7    7    1    2    FAULT\n0    7    0    2    FAULT\n1    7    0    1    FAULT\n----------------------------------------------------\nTotal references : 20\nPage faults      : 15\nPage hits        : 5\nHit ratio        : 5/20 = 0.25  (25.0%)\nFault ratio      : 15/20 = 0.75\n\n====================================================\nLRU Page Replacement\n====================================================\nRef  F1   F2   F3   Result\n----------------------------------------------------\n7    7    -    -    FAULT\n0    7    0    -    FAULT\n1    7    0    1    FAULT\n2    2    0    1    FAULT\n0    2    0    1    HIT\n3    2    0    3    FAULT\n0    2    0    3    HIT\n4    4    0    3    FAULT\n2    4    0    2    FAULT\n3    4    3    2    FAULT\n0    0    3    2    FAULT\n3    0    3    2    HIT\n2    0    3    2    HIT\n1    1    3    2    FAULT\n2    1    3    2    HIT\n0    1    0    2    FAULT\n1    1    0    2    HIT\n7    1    0    7    FAULT\n0    1    0    7    HIT\n1    1    0    7    HIT\n----------------------------------------------------\nTotal references : 20\nPage faults      : 12\nPage hits        : 8\nHit ratio        : 8/20 = 0.40  (40.0%)\nFault ratio      : 12/20 = 0.60\n\n====================================================\nCOMPARISON\n====================================================\nAlgorithm   Faults    Hit ratio \nFIFO        15        0.25      \nLRU         12        0.40      \n\nLRU performs better (fewer page faults, higher hit ratio)."}, {"code": "# JSPM UNIVERSITY, PUNE - Operating System Practical Examination\n# SET 10  |  Q.1 (30 Marks)  |  Group C - Optimal Page Replacement\n# Programme: B.Tech - Computer Science and Engineering\n#\n# Question Statement:\n# Implement the Optimal page replacement policy for the reference string: 1,\n# 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5. Run the simulation for 3 frames and for 4\n# frames. Display the frame contents after each reference, mark each reference\n# as a hit or a fault, and display the total page faults and hit ratio.\n# Explain why the Optimal policy is not implementable in a real operating\n# system.\n\"\"\"SET 10 : Optimal page replacement for 3 frames and 4 frames\"\"\"\n\nPAGES = [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]\n\n\ndef optimal(frames_count):\n    print(f\"\\n{'=' * 56}\\nOptimal Page Replacement - {frames_count} frames\\n{'=' * 56}\")\n    print(f\"{'Ref':<5}\" + \"\".join(f\"{'F' + str(i + 1):<5}\" for i in range(frames_count)) + \"Result\")\n    print(\"-\" * 56)\n\n    frames, faults = [None] * frames_count, 0\n    for i, page in enumerate(PAGES):\n        hit = page in frames\n        if not hit:\n            faults += 1\n            if None in frames:\n                frames[frames.index(None)] = page\n            else:\n                future = PAGES[i + 1:]\n                # distance to next use; never used again -> infinity (best victim)\n                next_use = {p: (future.index(p) if p in future else float(\"inf\")) for p in frames}\n                victim = max(frames, key=lambda p: next_use[p])\n                frames[frames.index(victim)] = page\n        cells = \"\".join(f\"{('-' if f is None else f):<5}\" for f in frames)\n        print(f\"{page:<5}{cells}{'HIT' if hit else 'FAULT'}\")\n\n    hits = len(PAGES) - faults\n    print(\"-\" * 56)\n    print(f\"Total references : {len(PAGES)}\")\n    print(f\"Page faults      : {faults}\")\n    print(f\"Page hits        : {hits}\")\n    print(f\"Hit ratio        : {hits}/{len(PAGES)} = {hits / len(PAGES):.2f}  ({hits / len(PAGES) * 100:.1f}%)\")\n    return faults, hits / len(PAGES)\n\n\nif __name__ == \"__main__\":\n    print(\"Page reference string:\", PAGES)\n    results = {n: optimal(n) for n in (3, 4)}\n\n    print(f\"\\n{'=' * 56}\\nSUMMARY\\n{'=' * 56}\")\n    print(f\"{'Frames':<10}{'Faults':<10}{'Hit ratio':<10}\")\n    for n, (f, r) in results.items():\n        print(f\"{n:<10}{f:<10}{r:<10.2f}\")\n\n    print(\"\"\"\nWhy the Optimal policy is not implementable in a real OS:\n  Optimal replaces the page whose next use is farthest in the future. This needs\n  advance knowledge of the entire future page-reference string, which an operating\n  system cannot know because it depends on run-time program behaviour and user input.\n  It is therefore used only as a theoretical benchmark to measure practical\n  algorithms such as FIFO, LRU and Clock.\"\"\")", "n": 10, "g": "C", "t": "Optimal Page Replacement", "f": "set10_optimal.py", "lang": "Python", "desc": "Reference string of 12 pages with 3 frames and 4 frames", "cmds": ["python3 set10_optimal.py"], "inp": null, "notes": ["Optimal evicts the page whose next use is farthest in the future.", "It needs knowledge of future references, so it cannot be implemented in a real OS – it is used as a benchmark."], "var": false, "out": "Page reference string: [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]\n\n========================================================\nOptimal Page Replacement - 3 frames\n========================================================\nRef  F1   F2   F3   Result\n--------------------------------------------------------\n1    1    -    -    FAULT\n2    1    2    -    FAULT\n3    1    2    3    FAULT\n4    1    2    4    FAULT\n1    1    2    4    HIT\n2    1    2    4    HIT\n5    1    2    5    FAULT\n1    1    2    5    HIT\n2    1    2    5    HIT\n3    3    2    5    FAULT\n4    4    2    5    FAULT\n5    4    2    5    HIT\n--------------------------------------------------------\nTotal references : 12\nPage faults      : 7\nPage hits        : 5\nHit ratio        : 5/12 = 0.42  (41.7%)\n\n========================================================\nOptimal Page Replacement - 4 frames\n========================================================\nRef  F1   F2   F3   F4   Result\n--------------------------------------------------------\n1    1    -    -    -    FAULT\n2    1    2    -    -    FAULT\n3    1    2    3    -    FAULT\n4    1    2    3    4    FAULT\n1    1    2    3    4    HIT\n2    1    2    3    4    HIT\n5    1    2    3    5    FAULT\n1    1    2    3    5    HIT\n2    1    2    3    5    HIT\n3    1    2    3    5    HIT\n4    4    2    3    5    FAULT\n5    4    2    3    5    HIT\n--------------------------------------------------------\nTotal references : 12\nPage faults      : 6\nPage hits        : 6\nHit ratio        : 6/12 = 0.50  (50.0%)\n\n========================================================\nSUMMARY\n========================================================\nFrames    Faults    Hit ratio \n3         7         0.42      \n4         6         0.50      \n\nWhy the Optimal policy is not implementable in a real OS:\n  Optimal replaces the page whose next use is farthest in the future. This needs\n  advance knowledge of the entire future page-reference string, which an operating\n  system cannot know because it depends on run-time program behaviour and user input.\n  It is therefore used only as a theoretical benchmark to measure practical\n  algorithms such as FIFO, LRU and Clock."}];
